# Automated issue resolver: picks open issues, analyzes, implements,
# validates, and creates merge requests.
#
# Designed for ralph loop: `octos --loop 0 gitea-issue-to-mr.yaml`
# Each iteration picks one issue and works it to completion.
#
# Features:
#   - Parallel discovery (issue + codebase scan run simultaneously)
#   - Multi-artifact loading for minimal token usage
#   - Retry on flaky steps, skip on non-critical failures
#
# Requirements:
#   - GITEA_URL and GITEA_TOKEN env vars
#   - Repo must exist with open issues
#
# Label lifecycle: (none) → in-progress → in-review

agent:
  cmd: "kiro-cli"
  args: ["chat", "--no-interactive", "--trust-all-tools"]

context:
  gitea_url: "${GITEA_URL}"
  gitea_token: "${GITEA_TOKEN}"
  gitea_owner: "${GITEA_OWNER:-your-user}"
  repo: "${REPO:-your-repo}"
  language: "${LANGUAGE:-Go}"
  rules:
    - "KISS & YAGNI"
    - "Small, focused commits"
    - "Write tests for new/changed code"
    - "Do not break existing functionality"

steps:
  # ─── PHASE 1: Parallel discovery ─────────────────────────────────────
  # pick-issue and scan-codebase have no needs → run in parallel

  - name: pick-issue
    prompt: |
      Find the next open issue to work on.

      GET {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{{context.repo}}/issues?state=open&type=issues&limit=50&sort=oldest
      Authorization: token {{context.gitea_token}}

      Priority:
      1. Any issue with label "in-progress" (resuming previous work)
      2. Oldest issue without "in-progress" or "in-review" labels

      If none found, output exactly: NO_ISSUES_FOUND

      If found:
      - Add "in-progress" label (create if missing, color #fbca04)
      - Fetch all comments on the issue

      Output ONLY: issue number, title, body, labels, and comments.
    save_to: current-issue.txt

  - name: scan-codebase
    prompt: |
      Scan the project structure concisely:
      - List packages/modules and their purpose (one line each)
      - Note test framework and coverage approach
      - Note build system and CI config

      Output max 20 lines. No code, no suggestions.
    save_to: codebase-map.txt

  # ─── PHASE 2: Plan (needs both discoveries) ──────────────────────────

  - name: plan
    needs: ["pick-issue", "scan-codebase"]
    when: "{{pick-issue.output}} not_empty"
    load_from:
      - current-issue.txt
      - codebase-map.txt
    prompt: |
      Issue to fix:
      {{artifact.current-issue}}

      Codebase structure:
      {{artifact.codebase-map}}

      Read relevant source files. Analyze the root cause.
      Create a focused plan: files to change, tests to add.

      Post ONE comment on the issue with your analysis and plan:
      POST {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{{context.repo}}/issues/{number}/comments
      Authorization: token {{context.gitea_token}}
      Body: {"body": "## Analysis & Plan\n\n<analysis and plan>"}

      Output ONLY: issue number, title, and plan steps.
    save_to: plan.txt

  # ─── PHASE 3: Implement ──────────────────────────────────────────────

  - name: implement
    needs: ["plan"]
    load_from: plan.txt
    prompt: |
      Implement the fix based on:
      {{artifact.plan}}

      Rules: {{context.rules}}

      Steps:
      1. Create branch: fix/issue-{number}
      2. Implement changes + write tests
      3. Run tests: verify they pass
      4. Only update README if public API/config changed
      5. Small focused commits with descriptive messages
      6. Rebase: git fetch origin main && git rebase origin/main
      7. Push: git push -u origin fix/issue-{number} --force-with-lease

      Output ONLY: issue number, branch name, commits, test results.
    save_to: implementation.txt
    on_failure: retry
    max_retries: 1

  # ─── PHASE 4: Validate ───────────────────────────────────────────────

  - name: validate
    needs: ["implement"]
    load_from: implementation.txt
    prompt: |
      Validate the implementation:
      {{artifact.implementation}}

      You are on the branch. Do NOT re-run tests that already passed.

      Check:
      1. Coverage: run coverage check, add tests if below threshold
      2. Build: must compile cleanly
      3. Changes are minimal and focused

      If you added tests, push them.

      Last line must be exactly: VALIDATED or NEEDS_WORK
    save_to: validation.txt
    on_failure: retry
    max_retries: 1

  # ─── PHASE 5: Ship ───────────────────────────────────────────────────

  - name: create-mr
    needs: ["validate"]
    when: "{{validate.output}} contains VALIDATED"
    load_from: current-issue.txt
    prompt: |
      Issue: {{artifact.current-issue}}

      1. Create PR:
         POST {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{{context.repo}}/pulls
         Authorization: token {{context.gitea_token}}
         Body: {"title": "Fix #{number}: <title>", "body": "Closes #{number}\n\n<summary>", "head": "fix/issue-{number}", "base": "main"}

      2. Squash-merge:
         POST {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{{context.repo}}/pulls/{pr_number}/merge
         Authorization: token {{context.gitea_token}}
         Body: {"Do": "squash", "delete_branch_after_merge": true}

      3. Labels: remove "in-progress", add "in-review" (create if missing, color #0e8a16)

      4. Update local: git checkout main && git pull origin main

      Last line: MERGED or MERGE_FAILED
    on_failure: skip
