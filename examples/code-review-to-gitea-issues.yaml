# Automated code review pipeline that analyzes repos and creates
# labeled issues for findings (updates, improvements, concerns).
# Skips duplicates by checking existing open issues before creating.
#
# Features:
#   - Parallel setup: cloning + label creation run simultaneously
#   - Multi-artifact loading for issue deduplication
#   - Environment variable defaults for easy configuration
#
# Usage:
#   GITEA_URL=http://gitea:3000 GITEA_TOKEN=xxx octos code-review-to-gitea-issues.yaml

agent:
  cmd: "kiro-cli"
  args: ["chat", "--no-interactive", "--trust-all-tools"]

context:
  gitea_url: "${GITEA_URL}"
  gitea_token: "${GITEA_TOKEN}"
  gitea_owner: "${GITEA_OWNER:-your-user}"
  repos: "${REPOS:-project-alpha,project-beta}"
  principles:
    - "KISS: Keep It Simple Stupid"
    - "YAGNI: You Ain't Gonna Need It"
    - "Only suggest actionable, concrete changes"
    - "Each issue must be a single, specific finding"

steps:
  # ─── PHASE 1: Parallel setup ─────────────────────────────────────────
  # Clone repos and setup labels simultaneously

  - name: clone-repos
    prompt: |
      Clone these repos from Gitea into /tmp/octos-review/ (remove dir first if exists):

      Repos: {{context.repos}}

      For each repo:
      git clone --depth 1 {{context.gitea_url}}/{{context.gitea_owner}}/<repo>.git /tmp/octos-review/<repo>

      List the file tree of each repo (no .git dirs).
    save_to: repo-trees.txt

  - name: setup-labels
    prompt: |
      Create these labels in each repo from: {{context.repos}}
      Skip if they already exist.

      Labels:
      - "update" color "#0075ca"
      - "improvement" color "#a2eeef"
      - "best-practice" color "#7057ff"
      - "concern" color "#d73a4a"

      API: {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{repo}/labels
      Authorization: token {{context.gitea_token}}

      GET existing labels first, POST only missing ones.

  - name: fetch-existing-issues
    prompt: |
      For each repo in: {{context.repos}}
      Fetch ALL open issues.

      API: GET {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{repo}/issues?state=open&type=issues&limit=50
      Authorization: token {{context.gitea_token}}

      Output a JSON object: {"repo-name": ["issue title 1", "issue title 2", ...]}
    save_to: existing-issues.json

  # ─── PHASE 2: Analyze (needs cloned repos) ───────────────────────────

  - name: analyze-repos
    needs: ["clone-repos"]
    load_from: repo-trees.txt
    prompt: |
      Analyze each repo in /tmp/octos-review/. Read all source files and check:

      1. **Updates**: outdated deps, old language versions
      2. **Improvements**: code that violates KISS/YAGNI
      3. **Best practices**: missing error handling, no tests, hardcoded values
      4. **Concerns**: architectural problems, potential bugs

      Principles: {{context.principles}}

      Output JSON array:
      [{"repo": "name", "label": "update|improvement|best-practice|concern", "title": "Short title", "body": "Details with file refs"}]

      Be specific. Reference files and lines. Only real, actionable findings.
    save_to: findings.json

  # ─── PHASE 3: Create issues (needs analysis + existing issues) ───────

  - name: create-issues
    needs: ["analyze-repos", "setup-labels", "fetch-existing-issues"]
    load_from:
      - findings.json
      - existing-issues.json
    prompt: |
      Findings:
      {{artifact.findings}}

      Existing issues (DO NOT create duplicates):
      {{artifact.existing-issues}}

      For each NEW finding only (skip if similar title exists):
      1. GET label ID: {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{repo}/labels
      2. POST issue:
         {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{repo}/issues
         Authorization: token {{context.gitea_token}}
         Body: {"title": "<title>", "body": "<body>", "labels": [label_id]}

      Report: created vs skipped per repo.

  - name: cleanup
    needs: ["create-issues"]
    prompt: |
      Remove /tmp/octos-review/ directory.
      Output summary: issues created per repo and per label type.
