# Automated code review pipeline that analyzes repos and creates
# labeled Gitea issues for findings (updates, improvements, concerns).
# Skips duplicates by checking existing open issues before creating.
#
# Labels created automatically: update, improvement, best-practice, concern
#
# Usage:
#   1. Export env vars: GITEA_URL, GITEA_TOKEN
#   2. Optionally set GITEA_OWNER and REPOS
#   3. Run: octos code-review-to-gitea-issues.yaml
#
# Env vars:
#   GITEA_URL    — Gitea instance URL (required)
#   GITEA_TOKEN  — Personal access token (required)
#   GITEA_OWNER  — User/org owning the repos (default: your-user)
#   REPOS        — Comma-separated repo list (default: all configured)

agent:
  cmd: "kiro-cli"
  args: ["chat", "--no-interactive", "--trust-all-tools"]

context:
  role: "Senior software engineer doing code review and prospection"
  gitea_url: "${GITEA_URL}"
  gitea_token: "${GITEA_TOKEN}"
  gitea_owner: "${GITEA_OWNER:-your-user}"
  repos: "${REPOS:-project-alpha,project-beta,project-gamma}"
  labels:
    - "update"
    - "improvement"
    - "best-practice"
    - "concern"
  principles:
    - "KISS: Keep It Simple Stupid"
    - "YAGNI: You Ain't Gonna Need It"
    - "Only suggest actionable, concrete changes"
    - "Each issue must be a single, specific finding"
    - "Do not suggest over-engineering or unnecessary abstractions"

steps:
  - name: clone-repos
    prompt: |
      Clone these repos from Gitea into /tmp/octos-review/ (remove that dir first if exists):

      Repos to clone (comma-separated list): {{context.repos}}

      For each repo in that list:
      git clone --depth 1 {{context.gitea_url}}/{{context.gitea_owner}}/<repo>.git /tmp/octos-review/<repo>

      After cloning, list the file tree of each repo (no .git dirs). Output the tree for each.

  - name: analyze-repos
    prompt: |
      Analyze each repo in /tmp/octos-review/. For each repo, read all source files and check:

      1. **Updates**: outdated dependencies (go.mod, requirements.txt, package.json), old Go/Python versions
      2. **Improvements**: code that could be simpler following KISS/YAGNI principles
      3. **Best practices**: missing error handling, no tests, hardcoded values, missing docs, security issues
      4. **Concerns**: architectural problems, potential bugs, race conditions

      Principles to follow:
      {{context.principles}}

      Output a JSON array with this structure (one entry per finding):
      ```json
      [
        {
          "repo": "repo-name",
          "label": "update|improvement|best-practice|concern",
          "title": "Short descriptive title",
          "body": "Detailed description with file references and suggested fix"
        }
      ]
      ```

      Be specific. Reference actual files and line numbers. Only report real, actionable findings.
    save_to: findings.json

  - name: setup-labels
    prompt: |
      Create these labels in each repo from this list: {{context.repos}}
      Use curl with token authentication. Skip if they already exist.

      Labels to create (with colors):
      - "update" color "#0075ca"
      - "improvement" color "#a2eeef"
      - "best-practice" color "#7057ff"
      - "concern" color "#d73a4a"

      API: {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{repo}/labels
      Auth: -H "Authorization: token {{context.gitea_token}}"

      For each repo, first GET existing labels, then POST only missing ones.

  - name: fetch-existing-issues
    prompt: |
      For each repo in this list: {{context.repos}}
      Fetch ALL open issues from Gitea.

      API: GET {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{repo}/issues?state=open&type=issues&limit=50
      Auth: -H "Authorization: token {{context.gitea_token}}"

      Output a JSON object mapping repo name to list of existing issue titles.
    save_to: existing-issues.json

  - name: create-issues
    load_from: findings.json
    prompt: |
      Using the findings from the analysis:
      {{artifact.findings}}

      And the existing open issues:
      {{fetch-existing-issues.output}}

      IMPORTANT: Do NOT create an issue if an issue with the same or very similar title already exists in that repo. Skip duplicates.

      For each NEW finding only:
      1. GET the label ID: GET {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{repo}/labels
      2. POST the issue:
         API: POST {{context.gitea_url}}/api/v1/repos/{{context.gitea_owner}}/{repo}/issues
         Auth: -H "Authorization: token {{context.gitea_token}}"
         Body:
         ```json
         {
           "title": "{finding.title}",
           "body": "{finding.body}",
           "labels": [label_id]
         }
         ```

      Report: how many created, how many skipped (already existed) per repo.

  - name: cleanup
    prompt: |
      Remove /tmp/octos-review/ directory.
      Then output a final summary: how many issues were created per repo and per label type.
